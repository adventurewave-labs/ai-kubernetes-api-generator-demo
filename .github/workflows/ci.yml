name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: pip install -r requirements.txt
      - name: Tests (pytest)
        run: python3 -m pytest tests/ -v
      - name: Demo smoke (offline fallback)
        run: python examples/demo.py
